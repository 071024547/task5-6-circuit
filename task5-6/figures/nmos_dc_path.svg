<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360">
  <style>
    .wire { stroke:#111; stroke-width:2; fill:none; }
    .wire2 { stroke:#111; stroke-width:2.5; fill:none; }
    .label { font:15px sans-serif; fill:#111; }
    .small { font:13px sans-serif; fill:#333; }
    .node { fill:#111; }
  </style>

  <line class="wire" x1="80" y1="60" x2="420" y2="60"/>
  <text class="label" x="88" y="45">VDD = 5 V</text>

  <line class="wire" x1="190" y1="60" x2="190" y2="85"/>
  <polyline class="wire" points="190,85 172,102 208,136 190,153"/>
  <line class="wire" x1="190" y1="153" x2="190" y2="175"/>
  <text class="label" x="208" y="115">Rg1 = 60 k</text>
  <line class="wire" x1="190" y1="175" x2="190" y2="200"/>
  <polyline class="wire" points="190,200 208,217 172,251 208,285 190,302"/>
  <line class="wire" x1="190" y1="302" x2="190" y2="330"/>
  <text class="label" x="210" y="250">Rg2 = 40 k</text>

  <line class="wire" x1="360" y1="60" x2="360" y2="85"/>
  <polyline class="wire" points="360,85 342,102 378,136 342,170 360,187"/>
  <line class="wire" x1="360" y1="187" x2="360" y2="210"/>
  <text class="label" x="378" y="130">Rd = 2 k</text>

  <circle class="node" cx="190" cy="175" r="5"/>
  <text class="label" x="200" y="170">G</text>
  <circle class="node" cx="360" cy="210" r="5"/>
  <text class="label" x="370" y="205">D</text>

  <!-- NMOS symbol -->
  <line class="wire" x1="190" y1="175" x2="330" y2="175"/>
  <line class="wire2" x1="330" y1="175" x2="330" y2="310"/>
  <line class="wire2" x1="360" y1="210" x2="360" y2="310"/>
  <line class="wire2" x1="330" y1="225" x2="390" y2="225"/>
  <line class="wire2" x1="330" y1="250" x2="390" y2="250"/>
  <line class="wire2" x1="330" y1="225" x2="330" y2="250"/>
  <line class="wire2" x1="390" y1="225" x2="390" y2="250"/>
  <text class="label" x="398" y="260">NMOS</text>

  <line class="wire" x1="360" y1="310" x2="360" y2="330"/>
  <line class="wire" x1="360" y1="330" x2="460" y2="330"/>
  <line class="wire" x1="190" y1="330" x2="460" y2="330"/>
  <line class="wire" x1="300" y1="330" x2="300" y2="345"/>
  <line class="wire" x1="280" y1="345" x2="320" y2="345"/>
  <line class="wire" x1="290" y1="355" x2="310" y2="355"/>
  <text class="small" x="310" y="349">GND</text>

  <text class="label" x="70" y="100">DC path: remove Cb1 and Vi, then</text>
  <text class="label" x="70" y="120">VG = 5*40k/(60k+40k) = 2 V</text>
  <text class="small" x="70" y="140">ID = K*(VGS-Vth)^2*(1+lambda*VDS)</text>
  <text class="small" x="70" y="158">VDS = VDD - ID*Rd = 3.29 V (saturation)</text>
</svg>
