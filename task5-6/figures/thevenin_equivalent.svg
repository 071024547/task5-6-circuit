<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360">
  <style>
    .wire { stroke:#111; stroke-width:2; fill:none; }
    .box { stroke:#111; stroke-width:1.5; fill:#fff; }
    .label { font:15px sans-serif; fill:#111; }
    .small { font:13px sans-serif; fill:#333; }
    .node { fill:#111; }
  </style>

  <line class="wire" x1="80" y1="120" x2="220" y2="120"/>
  <line class="wire" x1="80" y1="120" x2="80" y2="205"/>
  <circle class="box" cx="80" cy="150" r="30"/>
  <text class="label" x="70" y="157">+</text>
  <text class="label" x="84" y="157">-</text>
  <line class="wire" x1="80" y1="180" x2="80" y2="280"/>
  <line class="wire" x1="80" y1="280" x2="220" y2="280"/>
  <text class="small" x="95" y="140">Vth = 6.6 V</text>

  <line class="wire" x1="220" y1="120" x2="250" y2="120"/>
  <polyline class="wire" points="250,120 268,105 302,135 336,105 370,135 390,120"/>
  <line class="wire" x1="390" y1="120" x2="440" y2="120"/>
  <text class="label" x="268" y="86">Rth = 1.485 kOhm</text>
  <line class="wire" x1="220" y1="280" x2="440" y2="280"/>

  <circle class="node" cx="440" cy="120" r="5"/>
  <text class="label" x="452" y="126">a_eq</text>
  <line class="wire" x1="440" y1="120" x2="520" y2="120"/>

  <!-- RL -->
  <line class="wire" x1="520" y1="120" x2="520" y2="160"/>
  <polyline class="wire" points="520,160 538,177 502,211 538,245 520,262"/>
  <line class="wire" x1="520" y1="262" x2="520" y2="280"/>
  <line class="wire" x1="520" y1="280" x2="620" y2="280"/>
  <text class="label" x="540" y="218">RL = 1 kOhm</text>

  <!-- ground -->
  <line class="wire" x1="80" y1="280" x2="140" y2="280"/>
  <line class="wire" x1="100" y1="280" x2="100" y2="305"/>
  <line class="wire" x1="76" y1="305" x2="124" y2="305"/>
  <line class="wire" x1="88" y1="315" x2="112" y2="315"/>
  <line class="wire" x1="97" y1="325" x2="103" y2="325"/>
  <text class="small" x="130" y="308">b (GND)</text>

  <line class="wire" x1="520" y1="280" x2="620" y2="280"/>
  <line class="wire" x1="570" y1="280" x2="570" y2="305"/>
  <line class="wire" x1="546" y1="305" x2="594" y2="305"/>
  <line class="wire" x1="558" y1="315" x2="582" y2="315"/>
  <line class="wire" x1="567" y1="325" x2="573" y2="325"/>

  <text class="small" x="452" y="310">replace the original two-terminal network with Vth + Rth</text>
</svg>
