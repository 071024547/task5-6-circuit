<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440">
  <style>
    .wire { stroke:#111; stroke-width:2; fill:none; }
    .wired { stroke:#555; stroke-width:2; stroke-dasharray:7 5; fill:none; }
    .box { stroke:#111; stroke-width:1.5; fill:#fff; }
    .label { font:15px sans-serif; fill:#111; }
    .small { font:13px sans-serif; fill:#333; }
    .node { fill:#111; }
  </style>

  <!-- top rail and source -->
  <line class="wire" x1="150" y1="70" x2="420" y2="70"/>
  <line class="wire" x1="80" y1="70" x2="150" y2="70"/>
  <circle class="box" cx="80" cy="205" r="45"/>
  <text class="label" x="53" y="212">+</text>
  <text class="label" x="74" y="210">-</text>
  <text class="small" x="30" y="172">VS = 12 V</text>
  <line class="wire" x1="80" y1="250" x2="80" y2="330"/>
  <line class="wire" x1="80" y1="70" x2="80" y2="160"/>

  <!-- R1 -->
  <line class="wire" x1="300" y1="70" x2="300" y2="95"/>
  <polyline class="wire" points="300,95 282,112 318,146 282,180 300,197"/>
  <line class="wire" x1="300" y1="197" x2="300" y2="220"/>
  <text class="label" x="320" y="150">R1 = 2.7 kOhm</text>

  <!-- node A -->
  <circle class="node" cx="300" cy="220" r="5"/>
  <text class="label" x="312" y="226">a</text>
  <line class="wire" x1="300" y1="220" x2="570" y2="220"/>

  <!-- R2 -->
  <line class="wire" x1="300" y1="220" x2="300" y2="250"/>
  <polyline class="wire" points="300,250 318,267 282,301 318,335 300,352"/>
  <line class="wire" x1="300" y1="352" x2="300" y2="375"/>
  <text class="label" x="318" y="310">R2 = 3.3 kOhm</text>

  <!-- ground under R2 -->
  <line class="wire" x1="300" y1="375" x2="300" y2="405"/>
  <line class="wire" x1="268" y1="405" x2="332" y2="405"/>
  <line class="wire" x1="282" y1="415" x2="318" y2="415"/>
  <line class="wire" x1="294" y1="425" x2="306" y2="425"/>
  <text class="small" x="338" y="408">b (GND)</text>

  <!-- load RL dashed -->
  <line class="wire" x1="570" y1="220" x2="600" y2="220"/>
  <polyline class="wire" points="600,220 580,245 620,290 580,335 600,360"/>
  <line class="wire" x1="600" y1="360" x2="600" y2="405"/>
  <line class="wire" x1="568" y1="405" x2="632" y2="405"/>
  <line class="wire" x1="582" y1="415" x2="618" y2="415"/>
  <line class="wire" x1="594" y1="425" x2="606" y2="425"/>
  <text class="small" x="615" y="290">RL = 1 kOhm</text>
  <text class="small" x="612" y="308">(dashed: external)</text>

  <text class="label" x="90" y="120">port: node a and ground b</text>
</svg>
